[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "support-case-classification-engine"
version = "0.1.0"
description = "Production-ready two-stage IT support case classification API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic-settings>=2.6,<3",
  "prometheus-client>=0.21,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
ml = [
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "xgboost>=2.1,<3",
  "scikit-learn>=1.5,<2",
  "torch>=2.4,<3",
  "transformers>=4.46,<5",
  "httpx>=0.27,<1",
]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
ui = ["streamlit>=1.39,<2", "pandas>=2.2,<3"]
dev = ["support-case-classification-engine[test,ml,ui]", "ruff>=0.8,<1", "mypy>=1.13,<2"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
